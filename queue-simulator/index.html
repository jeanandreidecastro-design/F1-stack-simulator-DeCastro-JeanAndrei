<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Data Structure Simulator</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

    <script src="queue.js" defer></script>

    <link href="style.css" rel="stylesheet">
</head>

<body>

    <div class="container col-sm-8">

        <div class="row">
            <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">
                Queue Data Structure Simulator
            </h1>
        </div>

        <div class="row text-bg-success p-3 mb-1">

            <div class="col text-center fs-4">
                Operations
            </div>

            <div class="col text-center fs-4">
                Queue Data
            </div>

            <div class="col text-center fs-4">
                Deleted from Queue
            </div>

        </div>

        <div class="row bg-danger">

            <div class="col bg-7B8FA1">

                <div class="d-grid gap-1 col mx-auto">

                    <input
                        type="text"
                        id="queueInput"
                        class="form-control text-center mt-2"
                        placeholder="Enter data"
                        aria-label="data">

                    <button id="enqueueBtn"
                        class="btn btn-success"
                        type="button">
                        Enqueue
                    </button>

                    <button id="dequeueBtn"
                        class="btn btn-danger"
                        type="button">
                        Dequeue
                    </button>

                    <button id="peekBtn"
                        class="btn btn-warning"
                        type="button">
                        Peek
                    </button>

                    <button id="clearBtn"
                        class="btn btn-light"
                        type="button">
                        Clear
                    </button>

                </div>

            </div>

            <div id="queue" class="col bg-dark">
            </div>

            <div id="deleted" class="col popped bg-9C254D">
            </div>

        </div>

        <div id="message"
            class="text-center text-white mt-3">
        </div>

    </div>

</body>
</html>
